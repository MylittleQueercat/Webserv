server {
    listen 8080;
    server_name exemple.com;
    root ./www;
    client_max_body_size 1m;
    error_page 404 /errors/404.html;
    error_page 405 /errors/405.html;
    error_page 413 /errors/413.html;
    error_page 500 /errors/500.html;
    error_page 400 /errors/400.html;
    error_page 403 /errors/403.html;

    location / {
        methods GET POST;
        autoindex on;
        index index.html;
    }

    location /upload {
        methods GET POST DELETE;
        root ./uploads;
        upload_store ./uploads;
    }

    location /cgi-bin {
        methods GET POST;
        cgi_ext .py;
    }
    location /cgi-php {
        methods GET POST;
        cgi_ext .php;
    }
    location /cgi-sh {
        methods GET POST;
        cgi_ext .sh;
    }

    location /old {
        return 301 /new.html;
    }
}

server {
    listen 8081;
    server_name test.com;
    root ./www2;
    location / {
        methods GET;
        autoindex off;
        index index.html;
    }
}

server {
    listen 9090;
    root ./www;
    error_page 404 /errors/404.html;
    error_page 405 /errors/405.html;
    error_page 413 /errors/413.html;
    error_page 500 /errors/500.html;
    error_page 400 /errors/400.html;
    error_page 403 /errors/403.html;

    location / {
        methods GET;
        index index.html;
    }
}